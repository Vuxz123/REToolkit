<html lang="vi">
<head>

<title>REToolkit · Thiết kế flow mới</title>
<style>
:root{color-scheme:dark;--bg:#101316;--panel:#191d21;--border:#30363c;--muted:#a4afb9;--text:#edf1f4;--accent:#9be4bc;--amber:#f2cb83;--red:#ffa5aa;--blue:#a8cbff;font:14px/1.55 "Segoe UI",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}button,a,input,select,summary{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent)}button:disabled{cursor:not-allowed;opacity:.5}button{border:1px solid var(--border);background:#242a30;color:var(--text);padding:9px 14px;border-radius:8px}button:hover{background:#30383f}.primary{background:var(--accent);border-color:var(--accent);color:#11261a;font-weight:650}.primary:hover{background:#b9f5d3}.quiet{background:transparent}.small{font-size:12px;padding:6px 10px}a{color:var(--accent)}.prototype{height:41px;background:#273129;border-bottom:1px solid #4b6251;padding:6px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:12px;position:sticky;top:0;z-index:10}.prototype select{padding:3px 8px;background:#1b231e;border:1px solid #56665b;color:#f2fff5;border-radius:5px;font-size:12px}.layout{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 41px)}aside{padding:24px 16px;background:#15191c;border-right:1px solid var(--border);position:sticky;top:41px;height:calc(100vh - 41px);display:flex;flex-direction:column;gap:6px}.brand{display:flex;align-items:center;gap:10px;margin:0 8px 20px;font-size:20px;font-weight:650;letter-spacing:-.6px}.mark{background:var(--accent);color:#163321;border-radius:9px;padding:6px 8px;font-size:16px}.brand small{display:block;font-size:10px;letter-spacing:1.6px;color:var(--muted);font-weight:400}.nav-title{font-size:10px;letter-spacing:1.7px;color:#87929e;margin:20px 10px 8px}aside button{text-align:left;border:0;background:transparent;color:#adb7c0;padding:10px 12px}aside button.active{background:#283a30;color:#c0f3d3}aside .bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:14px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px}.shell{min-width:0}header{height:81px;padding:17px 30px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:18px;background:#14181b}.project-title{font-weight:650;font-size:17px;display:flex;gap:10px;align-items:center}.header-meta{font-size:12px;color:var(--muted);margin-top:4px}.header-actions{display:flex;align-items:center;gap:9px}.header-actions select,select,input{background:#1c2227;border:1px solid #414a53;color:var(--text);border-radius:7px;padding:9px 11px}main{padding:28px 30px 100px;max-width:1550px;margin:auto}h1{font-size:28px;line-height:1.25;margin:0 0 7px;letter-spacing:-.8px;font-weight:600}h2{font-size:16px;margin:0 0 12px;font-weight:600}h3{font-size:14px;margin:0 0 8px}p{margin:7px 0}.muted{color:var(--muted)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.8px;color:var(--accent);margin-bottom:11px}.page-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;min-width:0}.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:linear-gradient(110deg,#20332a,#1b2421 80%);border-color:#426151;margin-bottom:20px}.hero.warn{background:linear-gradient(110deg,#342c20,#24231f 85%);border-color:#6b5939}.hero h2{font-size:23px;line-height:1.3;margin-bottom:8px;letter-spacing:-.4px}.hero p{max-width:730px;color:#c1d0c7}.hero.warn p{color:#ddcead}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:flex;flex-direction:column;gap:14px}.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.9fr);gap:20px}.pills{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid #48515a;color:#c5cdd3;background:#252b30;padding:3px 9px;border-radius:20px;font-size:11px;white-space:nowrap}.good{color:var(--accent);border-color:#446b53;background:#25372c}.warn-text{color:var(--amber)}.warning{color:var(--amber);border-color:#705c38;background:#352f22}.error{color:var(--red);border-color:#6c4249;background:#36242a}.info{color:var(--blue);border-color:#465d7b;background:#263144}.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0 22px}.stage{border-top:3px solid #404950;padding:12px 10px 0;color:var(--muted);font-size:12px}.stage strong{display:block;font-size:13px;color:#bfc9d0;margin-bottom:3px}.stage.done{border-color:#81c89f}.stage.current{border-color:var(--amber)}.stage.current strong{color:var(--amber)}.job{padding:14px 0;border-bottom:1px solid var(--border)}.job:last-child{border-bottom:0}.job button{text-align:left;background:none;border:0;padding:0;color:var(--text);font-weight:600}.job .meta{font-size:12px;color:var(--muted);margin-top:4px}.progress-track{height:5px;border-radius:5px;background:#303b34;overflow:hidden;margin:12px 0}.progress-track span{display:block;height:100%;width:45%;background:var(--accent)}.indeterminate span{width:35%;animation:working 2.5s ease-in-out infinite alternate}@keyframes working{to{transform:translateX(180%)}}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.check{padding:12px 13px;background:#20262b;border-radius:8px}.check span{display:block;color:var(--muted);font-size:12px}.check strong{display:block;font-size:13px;margin-top:5px;font-weight:550}.section-head{margin:22px 0 12px}.list-row{border-bottom:1px solid var(--border);padding:13px 0}.list-row:last-child{border-bottom:0}.link-button{padding:0;color:var(--accent);border:0;background:transparent;text-align:left}.link-button:hover{background:transparent;text-decoration:underline}.footnote{font-size:12px;color:var(--muted);margin-top:12px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.toolbar input{min-width:200px}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:var(--muted);font-size:11px;font-weight:500;padding:10px 12px;border-bottom:1px solid var(--border)}.table td{padding:13px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top}.table tr:last-child td{border-bottom:0}.table-wrap{overflow:auto}.steps{display:flex;gap:8px;margin-bottom:22px}.step{flex:1;border-top:3px solid #3c454d;padding-top:9px;font-size:12px;color:var(--muted)}.step.on{border-color:var(--accent);color:var(--accent)}.empty{text-align:center;padding:40px 20px}.feature{display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid var(--border)}.feature:last-child{border:0}.feature p{font-size:12px;color:var(--muted)}.tabbar{display:flex;gap:8px;margin-bottom:18px}.tabbar .selected{color:var(--accent);border-color:#547b60}.branch{font-size:12px;margin:0 0 18px;color:var(--muted)}details{padding:13px 0;border-top:1px solid var(--border)}summary{cursor:pointer;color:#cad5dd}code{font:12px/1.6 Consolas,monospace;color:#b6c9db;overflow-wrap:anywhere}pre{white-space:pre-wrap;word-break:break-word;padding:15px;background:#101518;border:1px solid var(--border);border-radius:8px;font:12px/1.7 Consolas,monospace}.sticky-activity{position:fixed;bottom:0;left:224px;right:0;display:flex;justify-content:space-between;align-items:center;gap:20px;background:#1b2320;border-top:1px solid #3d5145;padding:11px 30px;z-index:8;font-size:12px}.toast{position:fixed;bottom:67px;left:50%;transform:translateX(-35%);background:#ecf4ed;color:#173322;padding:12px 20px;border-radius:9px;box-shadow:0 12px 45px #0009;z-index:80;max-width:min(600px,85vw);font-size:13px}.toast[hidden]{display:none}dialog{background:#191f23;color:var(--text);border:1px solid #48525d;border-radius:14px;padding:0;width:min(680px,93vw);max-height:90vh}dialog::backdrop{background:#050a0dbb}.modal-content{padding:27px}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}.modal-head h2{font-size:21px;margin:0}.modal-actions{border-top:1px solid var(--border);padding:17px 27px;display:flex;justify-content:space-between;align-items:center;gap:12px}.form-field{display:block;margin:17px 0;color:#cbd4dc;font-size:13px}.form-field input,.form-field select{display:block;width:100%;margin-top:7px}.hint{font-size:12px;color:var(--muted)}.inline-note{border-left:3px solid var(--amber);background:#2c281f;padding:12px 15px;font-size:13px;color:#e3d2b2;margin:14px 0}.drawer{position:fixed;right:0;top:41px;height:calc(100vh - 41px);width:min(515px,100vw);background:#1b2126;border:0;border-left:1px solid #52606c;border-radius:0;margin:0;padding:0;max-height:none}.drawer::backdrop{background:#05080b88}.drawer .modal-content{overflow:auto;height:100%;padding-bottom:70px}.timeline{border-left:1px solid #495850;margin-left:5px;padding-left:20px}.timeline p{position:relative;margin:19px 0;font-size:13px}.timeline p::before{content:"";position:absolute;width:8px;height:8px;left:-25px;top:7px;border-radius:50%;background:#7bb992}.timeline small{display:block;color:var(--muted)}.project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.project-card{display:block;text-align:left;width:100%;padding:22px;background:var(--panel);border:1px solid var(--border)}.project-card h2{margin-top:20px}.initial{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;background:#365944;color:#bff5d1;font-size:20px;font-weight:650}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.metrics{font-size:30px;letter-spacing:-1px}.sr-only{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden}.hide{display:none!important}@media(max-width:1100px){.grid{grid-template-columns:1fr}.project-grid{grid-template-columns:1fr 1fr}main{padding:23px 24px 95px}.hero h2{font-size:21px}}@media(max-width:800px){.layout{grid-template-columns:170px minmax(0,1fr)}aside{padding:18px 10px}.brand{font-size:17px}.header-actions select{max-width:120px}header{padding:15px;height:auto;flex-wrap:wrap}main{padding:20px 16px 95px}.hero{grid-template-columns:1fr}.sticky-activity{left:170px;padding:10px 16px}.pipeline{grid-template-columns:repeat(3,1fr)}.project-grid,.split{grid-template-columns:1fr}.prototype strong{max-width:44%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.checks{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
.check strong.good{background:transparent;border:0}.check strong.warn-text{background:transparent}aside nav{display:grid;gap:3px}aside nav button,.bottom button{width:100%;display:block}.bottom button{margin-bottom:3px}
.drawer{left:auto}
</style>
</head>
<body>
<div class="prototype"><strong>BẢN MẪU TƯƠNG TÁC · Dữ liệu minh hoạ</strong><label>Thử trạng thái <select id="scenario" aria-label="Trạng thái minh hoạ"><option value="running">Worker đang chạy</option><option value="blocked">Thiếu split APK</option><option value="ready">Sẵn sàng mở Agent</option><option value="unknown">Apply chưa rõ kết quả</option></select></label></div>
<div class="layout"><aside>
<div class="brand"><span class="mark">RE</span><div>REToolkit<small>RECONSTRUCTION</small></div></div>
<button data-page="home">← Tất cả project</button><div class="nav-title">PROJECT ĐANG CHỌN</div>
<nav aria-label="Điều hướng project"><button data-page="overview">Tổng quan</button><button data-page="reconstruct">Tái dựng</button><button data-page="resources">Tài nguyên</button><button data-page="validation">Kiểm chứng</button><button data-page="activity">Tác vụ & bằng chứng</button></nav>
<div class="bottom"><button data-page="libraries">Kho thư viện</button><button data-page="settings">Cài đặt</button><button data-page="advanced">Công cụ nâng cao ↗</button><p class="hint" style="margin:16px 12px 0"><span class="dot"></span>Chế độ thiết kế · local</p></div>
</aside><div class="shell"><header><div><div class="project-title" id="project-title">GoodSort · Ví dụ <span class="badge">Android · ARM64</span></div><div class="header-meta" id="header-meta">Project / Tổng quan · Bản xuất gốc</div></div><div class="header-actions"><label class="sr-only" for="harness">Loại Agent</label><select id="harness"><option>Codex CLI</option><option selected>Claude Code</option><option>Gemini CLI</option><option>OpenCode</option></select><button class="primary" id="open-agent">Mở Agent ↗</button></div></header><main id="main"></main></div></div>
<div class="sticky-activity" id="activity-bar"></div><div class="toast" id="toast" role="status" hidden></div>
<dialog id="wizard" aria-labelledby="wizard-title"></dialog><dialog id="detail" class="drawer" aria-labelledby="detail-title"></dialog>
<script>
const state={page:'overview',scenario:'running',project:'GoodSort · Ví dụ',branch:'Bản xuất gốc',wizard:1,name:'',source:'',device:'',package:'',agent:'not-started'};
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=(text,type='')=>`<span class="badge ${type}">${text}</span>`;
const action=(text,id,css='')=>`<button class="${css}" data-action="${id}">${text}</button>`;
const head=(title,desc,extra='')=>`<div class="page-head"><div><h1>${title}</h1><p class="muted">${desc}</p></div>${extra}</div>`;
function notify(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#toast').hidden=true,5000)}
const scenarios={running:{title:'Đang kiểm tra liên kết asset–script',desc:'Worker đang xử lý phạm vi Item / Slot. Cậu có thể xem tiến trình và duyệt bằng chứng trong lúc chờ.',cta:'Xem tiến trình',action:'job',tag:'Đang xử lý',tone:'info'},blocked:{title:'Cần bổ sung dữ liệu từ split APK',desc:'Build ví dụ thiếu đầu vào IL2CPP. Chọn đúng thiết bị và app để kiểm tra bản cài có thể bổ sung dữ liệu nào.',cta:'Kiểm tra từ LDPlayer',action:'recover',tag:'Cần xử lý',tone:'warning'},ready:{title:'Tiếp tục tái dựng cùng Agent',desc:'Các bước chuẩn bị đã có kết quả. Mở Agent với context project và giao việc theo checklist đã lưu.',cta:'Mở Agent ↗',action:'agent',tag:'Đã chuẩn bị',tone:'good'},unknown:{title:'Cần kiểm tra kết quả apply trước',desc:'Worker đã thoát, kết quả ghi chưa được xác minh. Đọc operation và receipt trước khi quyết định bước tiếp theo.',cta:'Kiểm tra operation',action:'job',tag:'Chưa rõ kết quả',tone:'warning'}};
function checks(full=false){if(state.branch!=='Bản xuất gốc')return '<div class="inline-note">Chưa có bằng chứng cho nhánh staging đang chọn. Không kế thừa kết quả bản xuất gốc.</div>'+badge('Chưa xác minh','warning');if(['blocked','unknown'].includes(state.scenario))return '<div class="inline-note">Cần xử lý đầu vào hoặc kiểm tra operation trước khi xác nhận trạng thái hiện tại. Kết quả lịch sử không thay thế kiểm chứng mới.</div>'+badge('Hiện tại chưa xác minh','warning');return `<div class="checks">${[['Toàn vẹn source','Đã xác minh','good'],['Biên dịch Unity','Đạt ở lần kiểm tra trước','good'],['Liên kết asset–script',state.scenario==='running'?'Đang kiểm tra · 640 / 1.200':'Một phần · 640 / 1.200','warn-text'],['Gameplay','Chưa kiểm tra','muted'],['So với hình ảnh gốc','Thiếu ảnh đối chiếu','muted'],['Phạm vi bằng chứng','Item / Slot · bản xuất gốc','muted']].map(([l,v,c])=>`<div class="check"><span>${l}</span><strong class="${c}">${v}</strong></div>`).join('')}</div>${full?'<p class="footnote">Mỗi kết quả gắn với source, phạm vi và lần chạy cụ thể. Thay package hoặc source cần kiểm tra lại.</p>':''}`}
function pipeline(){return `<div class="pipeline">${[['01','Đầu vào','Đã chọn ARM64'],['02','Chuẩn bị','Native + asset'],['03','Tái dựng','Theo feature'],['04','Kiểm chứng','Phạm vi cụ thể'],['05','Gameplay','Chưa kiểm tra']].map(([n,t,d],i)=>`<div class="stage ${state.scenario==='blocked'?(i===0?'current':''):(i<2?'done':i===(state.scenario==='ready'?2:3)?'current':'')}"><strong>${n} ${t}</strong>${d}</div>`).join('')}</div>`}
function overview(){const s=state.branch==='Bản xuất gốc'?scenarios[state.scenario]:{title:'Nhánh staging chưa được kiểm chứng',desc:'Xem đúng đầu ra và tạo bằng chứng cho nhánh này. Tác vụ lịch sử của bản xuất gốc được ghi nhãn riêng bên dưới.',cta:'Xem kiểm chứng',action:'validation',tag:'Chưa xác minh',tone:'warning'};return head('Tiếp tục từ nơi cậu đang làm','Một project, một bước tiếp theo rõ ràng.')+`<section class="card hero ${['blocked','unknown'].includes(state.scenario)?'warn':''}"><div><div class="eyebrow">Bước tiếp theo</div><h2>${s.title}</h2><p>${s.desc}</p></div>${action(s.cta,s.action,'primary')}</section>`+pipeline()+`<div class="grid"><div class="stack"><section class="card"><div class="row"><h2>Đang diễn ra</h2>${badge(s.tag,s.tone)}</div><div class="job"><div class="row">${action(state.scenario==='unknown'?'Áp dụng source · cần kiểm tra':'Unity · Kiểm tra phạm vi Item / Slot','job','link-button')}<span class="hint">${state.scenario==='running'?'12 phút 08 giây':'Lần gần nhất'}</span></div><p class="meta">Agent / MCP · bản xuất gốc · minh hoạ · ${state.scenario==='unknown'?'Worker đã thoát':'Cập nhật quan sát: 2 giây trước'}</p>${state.scenario==='running'?'<div class="progress-track"><span style="width:53.3%"></span></div><p class="hint">640 / 1.200 asset đã quan sát · không phải tiến độ toàn game</p>':'<p class="hint">Mở chi tiết để xem trạng thái và bằng chứng của operation.</p>'}</div><div class="row"><span class="hint">Lệnh desktop và worker nền được phân biệt.</span>${action('Xem mọi tác vụ','activity','link-button')}</div></section><section class="card"><div class="row"><h2>Checklist gần nhất</h2>${action('Mở tái dựng','reconstruct','link-button')}</div><div class="list-row row"><span>✓ Khôi phục khởi tạo event</span>${badge('Source đã áp dụng','good')}</div><div class="list-row row"><span>◌ Kiểm tra Slot / Layer</span>${badge('Đang xác minh','warning')}</div><div class="list-row row"><span>○ Chạy một lượt gameplay</span>${badge('Chưa chạy')}</div><p class="footnote">Tên và trạng thái ở bản mẫu là ví dụ, không lấy từ project thật.</p></section></div><div class="stack"><section class="card"><div class="row"><h2>Đã kiểm chứng đến đâu?</h2>${action('Chi tiết','validation','link-button')}</div>${checks()}</section><section class="card"><h2>Đầu vào đã chọn</h2><div class="row"><span>${state.scenario==='blocked'?'Build cần bổ sung dữ liệu':'APK · ARM64 · metadata'}</span>${badge(state.scenario==='blocked'?'Thiếu đầu vào':'Đã chọn',state.scenario==='blocked'?'warning':'good')}</div><details><summary>Xem hoặc thay đầu vào</summary><p class="hint">01_Extracted / lib / arm64-v8a / libil2cpp.so</p><p class="hint">Đổi lựa chọn sẽ làm mất hiệu lực các bước phụ thuộc.</p>${action('Mở tài nguyên','resources','small')}</details></section></div></div>`}
function home(){return head('Project của cậu','Mở lại công việc đang làm hoặc bắt đầu từ một build mới.',action('+ Tạo project','new','primary'))+`<div class="project-grid"><button class="project-card" data-action="overview"><div class="row"><span class="initial">GS</span>${badge(scenarios[state.scenario].tag,scenarios[state.scenario].tone)}</div><h2>${esc(state.project)}</h2><p class="muted">Android · ARM64</p><p class="hint">${scenarios[state.scenario].title}</p><hr style="border:0;border-top:1px solid var(--border);margin:20px 0"><span class="hint">Bản xuất gốc · dữ liệu minh hoạ</span></button><section class="card empty"><div class="initial" style="margin:0 auto 18px">+</div><h2>Tạo từ APK / XAPK</h2><p class="muted">Giữ build gốc, kiểm tra đầu vào,<br>chuẩn bị và theo dõi tiến trình.</p>${action('Tạo project mới','new','quiet')}</section></div><section class="card" style="margin-top:25px"><h2>Trước khi bắt đầu</h2><p class="muted">Công cụ chỉ cần sẵn sàng cho tác vụ sắp chạy. Không yêu cầu cài lại toàn bộ khi mở project.</p>${action('Xem cấu hình công cụ','settings','link-button')}</section>`}

function wizardContent(){const recovery=state.scenario==='blocked';const host=$('#wizard');host.innerHTML=`<div class="modal-content"><div class="modal-head"><h2 id="wizard-title">${recovery?'Bổ sung dữ liệu build':'Tạo project mới'}</h2><button data-close="wizard" aria-label="Đóng">✕</button></div><div class="steps">${['Chọn nguồn','Kiểm tra đầu vào','Xác nhận'].map((s,i)=>`<div class="step ${state.wizard===i+1?'on':''}">${i+1}. ${s}</div>`).join('')}</div>${state.wizard===1?`<p class="muted">${recovery?'Chỉ lấy từ đúng bản game đang cài; không chọn thiết bị hoặc package thay cậu.':'Ví dụ thao tác tạo project. Không tải hoặc giải nén file thật.'}</p><label class="form-field">Tên project<input id="create-name" value="${esc(state.name)}" placeholder="Ví dụ: MyGame" maxlength="64" ${recovery?'readonly':''}></label><label class="form-field">Build APK / XAPK<input id="create-source" value="${esc(state.source)}" placeholder="D:/Builds/game.xapk"></label>${action('Dùng build mẫu','sample','quiet small')}<p class="hint">Bản triển khai sẽ có file picker và kiểm tra định dạng thực.</p>`:state.wizard===2?recovery?`<div class="inline-note">Thiếu đầu vào trong build ví dụ. Cần đối chiếu chữ ký, phiên bản và base APK trước khi pull.</div><label class="form-field">Thiết bị<select id="device"><option value="">Chọn rõ thiết bị</option><option value="emulator-5554" ${state.device?'selected':''}>LDPlayer · emulator-5554 (ví dụ)</option></select></label><label class="form-field">App trên thiết bị<select id="package"><option value="">Chọn package của game</option><option value="com.fixture.game" ${state.package?'selected':''}>com.fixture.game · bản ví dụ</option></select></label><p class="hint">Trong sản phẩm: danh sách app chỉ được đọc sau khi chọn thiết bị; còn phải kiểm tra danh tính build.</p>`:`<div class="list-row row"><span>Đầu vào ưu tiên</span>${badge('ARM64 · tự chọn','good')}</div><div class="list-row row"><span>Metadata</span>${badge('Đã tìm thấy · ví dụ','good')}</div><div class="list-row row"><span>Chuẩn bị nền</span>${badge('Native + asset')}</div><details><summary>Tùy chọn nâng cao</summary><p class="hint">Symbol mặc định chỉ lập plan. Áp symbol cần chính sách ghi và RVA/VA rõ ràng. Không đoán địa chỉ để tiếp tục.</p></details>`:`<h3>${esc(state.name)}</h3><p class="muted">${esc(state.source)}</p><div class="inline-note">${recovery?'Mô phỏng kiểm tra danh tính và pull đúng bộ cài; userdata là đầu ra riêng.':'Giữ build gốc → quét/chọn đầu vào → chuẩn bị nền. Handoff và tiến trình thuộc project.'}</div><p class="hint">Đóng bản mẫu không làm gì tới project thật. Tất cả trạng thái dưới đây chỉ mô phỏng.</p>`}<p id="wizard-error" role="status" class="warn-text"></p></div><div class="modal-actions">${action(state.wizard===1?'Đóng':'← Quay lại',state.wizard===1?'wizard-close':'wizard-back','quiet')}${action(state.wizard===3?(recovery?'Mô phỏng kiểm tra & pull':'Mô phỏng tạo & chuẩn bị'):'Tiếp tục →','wizard-next','primary')}</div>`}
function openWizard(recovery=false){state.wizard=1;state.name=recovery?state.project.replace(' · Ví dụ',''):'';state.source=recovery?'00_OriginalBuild/example.xapk':'';state.device='';state.package='';wizardContent();$('#wizard').showModal()}
function wizardNext(){if(state.wizard===1){state.name=$('#create-name').value.trim();state.source=$('#create-source').value.trim();if(!/^[A-Za-z0-9_.-]{1,64}$/.test(state.name)||!state.source){$('#wizard-error').textContent='Nhập tên project hợp lệ và nguồn build.';return;}}if(state.wizard===2&&state.scenario==='blocked'){state.device=$('#device').value;state.package=$('#package').value;if(!state.device||!state.package){$('#wizard-error').textContent='Chọn rõ thiết bị và package; bản mẫu không chọn thay cậu.';return;}}if(state.wizard<3){state.wizard++;wizardContent();}else{$('#wizard').close();state.project=state.name+' · Ví dụ';state.scenario='running';$('#scenario').value='running';go('overview');notify('Đã mô phỏng gửi tác vụ. Không tạo project, pull dữ liệu hay chạy engine thật.');}}
document.addEventListener('click',event=>{const page=event.target.closest('[data-page]');if(page){go(page.dataset.page);return;}const close=event.target.closest('[data-close]');if(close){$('#'+close.dataset.close).close();return;}const tab=event.target.closest('[data-settings]');if(tab){document.querySelectorAll('[data-settings]').forEach(b=>b.classList.toggle('selected',b===tab));$('#settings-content').innerHTML=settingsContent(tab.dataset.settings);return;}const button=event.target.closest('[data-action]');if(!button)return;const a=button.dataset.action;if(pages[a]){if($('#detail').open)$('#detail').close();go(a);}else if(a==='agent'||a==='job')showDetail(a);else if(a==='new'){state.scenario='ready';$('#scenario').value='ready';openWizard();}else if(a==='recover'){state.scenario='blocked';$('#scenario').value='blocked';openWizard(true);}else if(a==='wizard-next')wizardNext();else if(a==='wizard-back'){state.wizard--;wizardContent();}else if(a==='wizard-close')$('#wizard').close();else if(a==='sample'){$('#create-name').value='DemoGame';$('#create-source').value='D:/Builds/demo.xapk';}else if(a==='branch')go('validation');else if(a==='agent-open'){state.agent='opened';showDetail('agent');}else if(a==='agent-fail'){state.agent='failed';showDetail('agent');}else if(a==='agent-watch'){$('#wake-state').innerHTML=`<div class="inline-note">Watcher: running · waiting · transportReady: true. Đủ điều kiện ghi nhận thông báo đã được chuẩn bị.</div>${action('Mô phỏng job xong → thông báo queued','agent-queue','small')}`;}else if(a==='agent-queue'){$('#wake-state').innerHTML='<div class="inline-note">Delivery: queued · Agent resumed: chưa xác minh. Cần quan sát phiên Agent để biết có thực sự tiếp tục.</div>';}else if(a==='search'){notify('Tra cứu minh hoạ: Slot.prefab và Slot.cs. Bản sản phẩm cần asset adapter có phân trang.');}else notify({'state-help':'Hoàn tất lệnh, kết quả nghiệp vụ và độ phủ kiểm chứng là ba thông tin riêng.','recovery-help':'Đọc receipt + trạng thái operation; không tự retry tác vụ ghi chưa rõ kết quả.','visual-help':'Cần ảnh/video gốc, trạng thái màn hình tương ứng và vùng so sánh cụ thể.','library-root':'Bản triển khai dùng chọn folder và quét catalog; bản mẫu không đọc ổ đĩa.','advanced-help':'Thiết kế giữ các lệnh hiện có, với form đúng loại và project được khóa theo context.','jev-help':'Jev chỉ gửi khi được yêu cầu trong phạm vi; không nhập API key vào bản mẫu.'}[a]||'Thao tác này đang được mô tả ở mức thiết kế.');});
document.addEventListener('change',event=>{if(event.target.id==='scenario'){state.scenario=event.target.value;render();}if(event.target.id==='branch'){state.branch=event.target.value;render();}if(event.target.id==='harness')state.agent='not-started';});
document.addEventListener('input',event=>{if(event.target.id==='job-filter'){const q=event.target.value.toLocaleLowerCase();document.querySelectorAll('#job-rows tr').forEach(r=>r.hidden=!r.textContent.toLocaleLowerCase().includes(q));}});
$('#open-agent').addEventListener('click',()=>showDetail('agent'));
render();
</script>
</body></html>
