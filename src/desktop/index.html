<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REToolkit</title><link rel="stylesheet" href="retk://app/style.css"><script defer src="retk://app/renderer.js"></script></head>
<body><aside><div class="brand"><span class="mark">RE</span><div>REToolkit<small>UNITY RECONSTRUCTION</small></div></div><div class="section-label">WORKSPACE</div><select id="workspace"><option value="">Chọn workspace</option></select><div id="navigation"></div><div class="sidebar-bottom"><span class="status-dot"></span> Local desktop <span id="version"></span><p id="toolkit-root"></p></div></aside>
<main><header><div><div class="eyebrow">REVERSE ENGINEERING WORKBENCH</div><h1 id="page-title">Tổng quan</h1></div><button id="refresh" class="secondary">Làm mới</button></header><div class="notice">Prepared, compiled, bindings và hành vi là các kết quả riêng. Mỗi kết luận cần bằng chứng tương ứng.</div><section id="overview" data-panel="workspace"><div id="workspace-summary" class="summary-grid"></div></section><section class="workspace-content"><div class="card"><div class="card-heading"><h2>Thao tác</h2><span id="operation-count" class="badge"></span></div><label>Thao tác có sẵn<select id="operation"></select></label><div id="fields"></div><button id="execute" class="primary">Chạy tác vụ</button><p id="action-status" class="muted"></p></div><div class="card jobs"><div class="card-heading"><h2>Tác vụ</h2><span id="queue-count" class="badge">0</span></div><div id="jobs"></div></div></section><section class="card result-card"><div class="card-heading"><h2>Kết quả và evidence</h2><span id="result-state" class="badge">Chưa có kết quả</span></div><pre id="result">Chọn workspace và thao tác để bắt đầu.</pre></section></main></body></html>
